server {
    listen 80;
    server_name _;
    root /usr/share/nginx/atom;

    client_max_body_size 100M;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ ^/(index|qubit_dev)\.php(/|$) {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ==========================================================================
    # DIGITAL OBJECTS - ACCESS CONTROL (issue #258)
    #
    # AtoM routes /uploads/r/* to digitalobject/view (apps/qubit/config/routing.yml,
    # route "upload"), which enforces the readMaster / readReference /
    # readThumbnail ACL and then returns the file via X-Accel-Redirect to
    # /private/...
    #
    # Serving /uploads/r/ statically bypasses ACL, draft status, embargo and
    # security clearance entirely. On the pre-container deployment this was a
    # live exposure: a draft record's page returned 403 to an anonymous user
    # while its master PDF downloaded in full from the raw URL.
    #
    # These blocks MUST come before the generic static-asset rule below, and the
    # static rule MUST stay scoped to theme/vendor directories. A blanket
    # `location ~* \.(png|jpg|...)$` matches image masters under /uploads/r/ and
    # silently reopens the bypass - regex locations are evaluated in order and
    # the first match wins.
    # ==========================================================================

    # Reference (_141) and thumbnail (_142) derivatives: static fast path.
    # Regex locations are evaluated before plain prefix locations, so this wins
    # over "location /uploads/r/" below. Do NOT add ^~ to that prefix block or
    # this stops matching and every thumbnail is served by PHP.
    #
    # Note the naming convention is not universal - some derivatives are named
    # _thumbnail/_reference and some carry no marker at all. Anything unmatched
    # falls through to the ACL path below, which is the safe direction.
    location ~* ^/uploads/r/.+_(141|142)\.[A-Za-z0-9]+$ {
        expires 7d;
        log_not_found off;
    }

    # Everything else under /uploads/r/ is treated as a master and must go
    # through the application so the ACL applies. try_files with a path that
    # never exists forces the fallback to index.php.
    location /uploads/r/ {
        try_files /nonexistent /index.php?$args;
    }

    # Internal target for the X-Accel-Redirect emitted by digitalobject/view
    # (it sends: X-Accel-Redirect: /private/uploads/r/<path>). "internal" makes
    # this unreachable from outside; without it the ACL check passes and the
    # download then 404s.
    location /private/ {
        internal;
        alias /usr/share/nginx/atom/;
    }

    # Static assets: scoped to theme and vendor directories so it cannot match
    # digital objects under /uploads/. See the warning above before widening.
    location ~* ^/(css|dist|js|images|plugins|vendor|arDominionB5Plugin|ahgThemeB5Plugin|web)/.*\.(js|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }
}
