#
# AtoM Framework - digital object access control
# ========================================================
# Include this in your server block, BEFORE the catch-all location.
#
#   include /path/to/atom-framework/config/nginx/digital-object-access.conf;
#
# Two rules, and the site is only safe with both.
#
# WHY THIS EXISTS
#
# AtoM stores masters and their derivatives side by side under uploads/r/. Served
# statically, every one of them is public: the readMaster ACL, publication status
# and embargo are all decided in PHP, and nginx never asks. A master of an
# unpublished or access-restricted description was downloadable by anyone holding
# the URL, and those URLs appear in page source and in IIIF manifests.
#
# Derivatives - reference (_141) and thumbnail (_142) - are public by design and
# stay static, which is what keeps browse and viewer pages fast.
#
# THIS FILE MUST TRAVEL WITH THE APPLICATION
#
# It was previously applied by hand to individual servers. A host rebuilt from a
# template, or a new instance stood up from the same recipe, silently came back
# without it - which is how one instance ran for months serving masters to anyone
# while its sibling did not.
#

# ----------------------------------------------------------------------
# 1. Derivatives: public, static, cacheable.
# ----------------------------------------------------------------------
location ~* ^/uploads/r/.+_(141|142)\.[A-Za-z0-9]+$ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires 7d;
}

# ----------------------------------------------------------------------
# 2. Everything else under uploads/r/ is a master: force it through AtoM so
#    the ACL runs. try_files with a path that cannot exist falls through to
#    index.php, the same mechanism the catch-all location uses.
# ----------------------------------------------------------------------
location /uploads/r/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    try_files /nonexistent /index.php?$args;
}

# ----------------------------------------------------------------------
# 3. Internal target for the X-Accel-Redirect that digitalobject/view emits
#    once the ACL has passed. "internal" keeps it unreachable from outside.
#    Without it the check succeeds and the download then 404s, which reads
#    like a permissions bug and is not one.
#
#    ADJUST THE ALIAS to this instance's document root.
# ----------------------------------------------------------------------
location /private/ {
    internal;
    alias /usr/share/nginx/atom/;
}
